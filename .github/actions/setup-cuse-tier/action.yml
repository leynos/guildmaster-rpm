name: Set up the CUSE acceptance tier
description: >
  Install tmt's virtual provisioner with a libvirt user session and check
  that the runner has usable KVM. The preflight fails the job if it does not;
  nothing falls back to emulation, the system connection or root.
runs:
  using: composite
  steps:
    - name: Install libvirt, QEMU and tmt's virtual provisioner
      shell: bash
      run: |
        sudo apt-get update
        sudo apt-get install --yes --no-install-recommends \
          libvirt-daemon libvirt-daemon-driver-qemu libvirt-clients libvirt-dev \
          qemu-system-x86 qemu-utils genisoimage pkg-config python3-dev gcc psmisc
        pipx install 'tmt[provision-virtual]==1.78.0'

    # Hosted runners ship /dev/kvm restricted to root and the kvm group.
    # This is GitHub's documented way to let the runner user reach it on an
    # ephemeral hosted runner. It is not something to do to a shared host.
    - name: Allow the runner user to use KVM
      shell: bash
      run: |
        echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' |
          sudo tee /etc/udev/rules.d/99-kvm4all.rules
        sudo udevadm control --reload-rules
        sudo udevadm trigger --name-match=kvm

    - name: Start the user manager
      shell: bash
      run: |
        sudo loginctl enable-linger "$(id -un)"
        echo "XDG_RUNTIME_DIR=/run/user/$(id -u)" >> "$GITHUB_ENV"

    # testcloud and the libvirt bindings live in pipx's tmt environment,
    # which the system python3 cannot import from. The interpreter is
    # exported for the rest of the job, because scripts/cuse-guest.sh runs
    # the preflight again and would otherwise check the system python3.
    - name: Use tmt's Python for the preflight
      shell: bash
      run: |
        echo "PYTHON=$(dirname "$(readlink -f "$(command -v tmt)")")/python" >> "$GITHUB_ENV"

    - name: Preflight
      shell: bash
      run: scripts/virt-preflight.sh
