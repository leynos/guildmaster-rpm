name: Set up the container test tier
description: >
  Install tmt and check that the runner can run rootless systemd containers.
  The preflight fails the job if it cannot; nothing falls back to privileged
  containers.
runs:
  using: composite
  steps:
    - name: Install tmt
      shell: bash
      run: pipx install 'tmt[provision-container]==1.78.0'

    # A hosted runner's job does not run inside a login session, so the
    # user's systemd manager, which rootless Podman's systemd cgroup manager
    # and cgroup delegation depend on, is not there until lingering is on.
    - name: Start the user manager
      shell: bash
      run: |
        sudo loginctl enable-linger "$(id -un)"
        echo "XDG_RUNTIME_DIR=/run/user/$(id -u)" >> "$GITHUB_ENV"
        echo "DBUS_SESSION_BUS_ADDRESS=unix:path=/run/user/$(id -u)/bus" >> "$GITHUB_ENV"
        for _ in $(seq 1 30); do
          [ -S "/run/user/$(id -u)/bus" ] && break
          sleep 1
        done

    - name: Preflight
      shell: bash
      run: scripts/podman-preflight.sh
